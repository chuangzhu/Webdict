app-id: cz.chuang.Webdict
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: webdict

finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # GPU acceleration if needed
  - --device=dri
  # Needs to talk to the network:
  - --share=network
  # Needs to play pronunciation audio
  - --socket=pulseaudio

modules:
  - name: webdict
    buildsystem: meson
    sources:
      - type: dir
        path: .
